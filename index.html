<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#121b16">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>野生動物ハンティングライフ</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="stage">
 <canvas id="gl"></canvas>
 <div id="flash"></div>
 <div id="ui">
  <div class="chip" id="info"></div>
  <button class="chip gunchip" id="gun"></button>
  <div class="chip" id="mis"></div>
  <div id="notes"></div>
  <div id="mini"><canvas id="mc" width="96" height="96"></canvas></div>
  <button class="hb" id="menuBtn"><span>☰</span><small>メニュー</small></button>
  <button class="hb" id="misBtn"><span>📋</span><small>目標<b class="badge" id="misN"></b></small></button>
  <button class="hb" id="rotBtn"><span>↻</span><small>向き</small></button>
  <div id="stick"><div id="knob"></div></div>
  <div id="ret"></div><div id="hitm"></div>
  <button class="pill" id="act"></button>
  <button class="rbtn" id="trapB"><span>🪤</span><small>罠</small></button>
  <button class="rbtn" id="sneak"><span>🚶</span><small id="sneakL">通常</small></button>
  <button class="rbtn" id="aim"><span>🎯</span><small id="aimL">構える</small></button>
  <button class="rbtn" id="fire"><span>撃つ</span><small id="fa"></small></button>
  <div class="panel" id="panel"></div>
 </div>
 <div id="boot"><div class="bt">野生動物ハンティングライフ</div><div class="bs">横向きで遊びます（縦向きでも自動で横表示になります）</div><button class="pri big" id="start">はじめる</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(typeof THREE==='undefined'){document.getElementById('boot').innerHTML='<div style="padding:24px;line-height:1.7">3Dライブラリを読み込めませんでした。<br>通信状態を確認して、ページを再読み込みしてください。<br>（セーブデータは消えません）</div>'}</script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>
</body></html>
